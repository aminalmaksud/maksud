[package]
name = "streamhub"
version = "1.0.5"
description = "StreamHub: MusingsofMaksudTV for Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
