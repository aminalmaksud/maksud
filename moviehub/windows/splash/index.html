<!doctype html>
<html><head><meta charset="utf-8"><title>StreamHub</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6efe4; color: #6b4a2b; font: 15px "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  .dot { width: 10px; height: 10px; margin: 0 4px; display: inline-block; border-radius: 50%; background: #7a1820; animation: b 1s infinite alternate; }
  .dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes b { to { opacity: .2; } }
</style></head>
<body><div style="text-align:center"><div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><p>Starting StreamHub…</p></div></body></html>
