<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MusingsofMaksudTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Cinzel:wght@600;700&display=swap">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>try { document.documentElement.dataset.theme = (JSON.parse(localStorage.getItem('mh.prefs')) || {}).theme || 'parchment'; } catch { document.documentElement.dataset.theme = 'parchment'; }</script>
</head>
<body>
<header id="top">
  <button id="backBtn" class="icon-btn" title="Back (⌘[)" hidden></button>
  <a id="logo" href="#/"><img class="logo-mark" src="logo.svg" alt=""><span class="logo-text"><b>Musings of Maksud</b><small>মুসিংস অব মাকসুদ • টিভি</small></span><span class="logo-tv">TV</span></a>
  <nav id="nav"></nav>
  <div class="search">
    <span class="search-ico"></span>
    <input id="filter" type="search" placeholder="Titles, people, years…" autocomplete="off" spellcheck="false">
  </div>
  <button id="refreshBtn" class="icon-btn" title="Refresh"></button>
  <button id="settingsBtn" class="icon-btn" title="Settings"></button>
</header>

<section id="hero" hidden>
  <div class="hero-slides" id="heroArt"></div>
  <div class="hero-poster" id="heroPoster" hidden></div>
  <div class="hero-text" id="heroText">
    <span class="eyebrow">✦ আজকের বাছাই · Featured</span>
    <h1 id="heroTitle"></h1>
    <p class="hero-meta" id="heroMeta"></p>
    <p class="hero-overview" id="heroOverview"></p>
    <div class="d-actions"><button class="btn primary big" id="heroPlay"></button><button class="btn big" id="heroInfo">More info</button><button class="btn big" id="heroList"></button></div>
  </div>
  <button class="hero-arrow left" id="heroPrev" aria-label="Previous"></button>
  <button class="hero-arrow right" id="heroNext" aria-label="Next"></button>
  <div class="hero-dots" id="heroDots"></div>
  <div class="hero-timer"><i id="heroTimer"></i></div>
</section>

<main id="main">
  <div id="welcome" hidden>
    <span class="eyebrow">✦ মুসিংস অব মাকসুদ • টিভি</span>
    <h1>Musings of Maksud <span>TV</span></h1>
    <p>Every movie, series and anime on your ISP’s BDIX servers — beautifully arranged, with subtitles and sound that just work.</p>
    <div class="d-actions"><button class="btn primary big" id="welcomeDhakaflix">Use DhakaFlix servers</button><button class="btn big" id="welcomeOwn">Add my own server</button></div>
  </div>
  <div id="folderHead" hidden>
    <nav id="crumbs"></nav>
    <h1 id="folderTitle"></h1>
    <p id="folderSub"></p>
  </div>
  <p id="status" role="status"></p>
  <div id="rows"></div>
  <div id="grid"></div>
</main>

<!-- Movie details -->
<div id="details" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-card">
    <div class="hero" id="dHero"></div>
    <button class="icon-btn sheet-close" data-close title="Close"></button>
    <div class="d-body">
      <div class="d-poster" id="dPoster"></div>
      <div class="d-info">
        <h2 id="dTitle"></h2>
        <p class="d-meta" id="dMeta"></p>
        <p class="d-overview" id="dOverview"></p>
        <div class="d-versions" id="dVersions" hidden></div>
        <div class="d-actions">
          <button class="btn primary" id="dPlay"></button>
          <button class="btn" id="dRestart" hidden>Start over</button>
          <button class="btn list-btn" id="dList"></button>
          <button class="btn" id="dFolder" hidden>All files</button>
          <button class="btn" id="dDownload" hidden></button>
          <button class="btn quiet" id="dForget" hidden></button>
        </div>
        <p class="d-file" id="dFile"></p>
      </div>
    </div>
  </div>
</div>

<!-- Player -->
<div id="player" hidden>
  <video id="video" playsinline></video>
  <div id="subLayer"><span></span></div>
  <div id="spinner"></div>
  <div id="pBanner" hidden></div>
  <div class="p-ui">
    <div class="p-top">
      <button class="icon-btn" id="pClose" title="Minimize — keeps playing (Esc)"></button>
      <div class="p-title"><b id="pTitle"></b><small id="pSub"></small></div>
      <span class="grow"></span>
      <button class="icon-btn" id="pList" title="Add to My List"></button>
    </div>
    <div class="p-bottom">
      <div class="seek" id="seek">
        <div class="seek-track"><i id="seekBuf"></i><i id="seekPlayed"></i><span id="seekKnob"></span></div>
        <div class="seek-tip" id="seekTip"></div>
      </div>
      <div class="p-row">
        <button class="icon-btn" id="pPlay" title="Play / pause (Space)"></button>
        <button class="icon-btn" id="pBack" title="Back 10 s (←)"></button>
        <button class="icon-btn" id="pFwd" title="Forward 10 s (→)"></button>
        <button class="icon-btn" id="pNext" title="Next episode (N)" hidden></button>
        <div class="vol">
          <button class="icon-btn" id="pMute" title="Mute (M)"></button>
          <input type="range" id="pVol" min="0" max="1" step="0.05" aria-label="Volume">
        </div>
        <span class="p-time" id="pTime">0:00 / 0:00</span>
        <span class="grow"></span>
        <button class="pill-btn" id="pAudio" title="Audio track (A)"></button>
        <button class="pill-btn" id="pSubs" title="Subtitles (C)"></button>
        <button class="pill-btn" id="pSpeed" title="Playback speed"></button>
        <button class="icon-btn" id="pDownload" title="Download to this Mac" hidden></button>
        <button class="icon-btn" id="pPip" title="Picture in picture"></button>
        <button class="icon-btn" id="pFull" title="Full screen (F)"></button>
      </div>
    </div>
    <div class="menu" id="menu" hidden></div>
  </div>
  <div id="upNext" hidden>
    <small>Up next</small>
    <b id="upNextTitle"></b>
    <div class="d-actions"><button class="btn primary" id="upNextPlay">Play now</button><button class="btn" id="upNextCancel">Cancel</button></div>
  </div>
  <div id="toast" hidden></div>
  <input type="file" id="subFile" accept=".srt,.vtt" hidden>
  <div class="mini-ui">
    <div class="mini-title" id="mTitle"></div>
    <div class="mini-btns"><button class="icon-btn" id="mExpand" title="Back to full size"></button><button class="icon-btn" id="mPlay" title="Play / pause"></button><button class="icon-btn" id="mClose" title="Stop"></button></div>
    <div class="mini-bar"><i id="mBar"></i></div>
  </div>
</div>
<div id="note" hidden></div>

<!-- Settings -->
<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Settings</h2>
    <label>Libraries <small>One per line, with a name: <code>TV Series | http://172.16.50.12/</code></small>
      <textarea name="servers" rows="5" spellcheck="false" placeholder="Movies | http://172.16.50.7/&#10;TV Series | http://172.16.50.12/" required></textarea></label>
    <button type="button" class="btn" id="dhakaflixBtn">Fill in DhakaFlix servers</button>
    <div class="two">
      <label>Username <small>if the server asks</small><input name="username" autocomplete="off"></label>
      <label>Password<input name="password" type="password" autocomplete="off"></label>
    </div>
    <label>TMDB API key <small>recommended — adds posters, backdrops, ratings and plot summaries. Free at <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org/settings/api</a></small>
      <input name="tmdbKey" autocomplete="off" spellcheck="false" placeholder="paste API key or read access token"></label>
    <div class="field"><span class="flabel">Theme</span>
      <div class="themes">
        <button type="button" class="theme-pick" data-theme-pick="parchment"><i></i>Parchment</button>
        <button type="button" class="theme-pick" data-theme-pick="night"><i></i>Night</button>
      </div>
    </div>
    <p class="note" id="ffmpegNote"></p>
    <div class="actions"><button type="button" class="btn" id="cancelBtn">Cancel</button><button type="submit" class="btn primary">Save</button></div>
  </form>
</dialog>
<script src="app.js" type="module"></script>
</body>
</html>
