<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MovieHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <button id="backBtn" class="icon-btn" title="Back (⌘[)" hidden></button>
  <a id="logo" href="#/">Movie<span>Hub</span></a>
  <div class="search">
    <span class="search-ico"></span>
    <input id="filter" type="search" placeholder="Search this folder" autocomplete="off" spellcheck="false">
  </div>
  <button id="refreshBtn" class="icon-btn" title="Refresh"></button>
  <button id="settingsBtn" class="icon-btn" title="Settings"></button>
</header>

<main id="main">
  <section id="continue" hidden>
    <h2>Continue watching</h2>
    <div class="row-scroll" id="continueRow"></div>
  </section>
  <div id="folderHead">
    <nav id="crumbs"></nav>
    <h1 id="folderTitle"></h1>
    <p id="folderSub"></p>
  </div>
  <p id="status" role="status"></p>
  <div id="grid"></div>
</main>

<!-- Movie details -->
<div id="details" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-card">
    <div class="hero" id="dHero"></div>
    <button class="icon-btn sheet-close" data-close title="Close"></button>
    <div class="d-body">
      <div class="d-poster" id="dPoster"></div>
      <div class="d-info">
        <h2 id="dTitle"></h2>
        <p class="d-meta" id="dMeta"></p>
        <p class="d-overview" id="dOverview"></p>
        <div class="d-actions">
          <button class="btn primary" id="dPlay"></button>
          <button class="btn" id="dRestart" hidden>Start over</button>
        </div>
        <p class="d-file" id="dFile"></p>
      </div>
    </div>
  </div>
</div>

<!-- Player -->
<div id="player" hidden>
  <video id="video" playsinline></video>
  <div id="subLayer"><span></span></div>
  <div id="spinner"></div>
  <div id="pBanner" hidden></div>
  <div class="p-ui">
    <div class="p-top">
      <button class="icon-btn" id="pClose" title="Back (Esc)"></button>
      <div class="p-title"><b id="pTitle"></b><small id="pSub"></small></div>
    </div>
    <div class="p-bottom">
      <div class="seek" id="seek">
        <div class="seek-track"><i id="seekBuf"></i><i id="seekPlayed"></i><span id="seekKnob"></span></div>
        <div class="seek-tip" id="seekTip"></div>
      </div>
      <div class="p-row">
        <button class="icon-btn" id="pPlay" title="Play / pause (Space)"></button>
        <button class="icon-btn" id="pBack" title="Back 10 s (←)"></button>
        <button class="icon-btn" id="pFwd" title="Forward 10 s (→)"></button>
        <button class="icon-btn" id="pNext" title="Next episode (N)" hidden></button>
        <div class="vol">
          <button class="icon-btn" id="pMute" title="Mute (M)"></button>
          <input type="range" id="pVol" min="0" max="1" step="0.05" aria-label="Volume">
        </div>
        <span class="p-time" id="pTime">0:00 / 0:00</span>
        <span class="grow"></span>
        <button class="pill-btn" id="pAudio" title="Audio track (A)"></button>
        <button class="pill-btn" id="pSubs" title="Subtitles (C)"></button>
        <button class="pill-btn" id="pSpeed" title="Playback speed"></button>
        <button class="icon-btn" id="pPip" title="Picture in picture"></button>
        <button class="icon-btn" id="pFull" title="Full screen (F)"></button>
      </div>
    </div>
    <div class="menu" id="menu" hidden></div>
  </div>
  <div id="upNext" hidden>
    <small>Up next</small>
    <b id="upNextTitle"></b>
    <div class="d-actions"><button class="btn primary" id="upNextPlay">Play now</button><button class="btn" id="upNextCancel">Cancel</button></div>
  </div>
  <div id="toast" hidden></div>
  <input type="file" id="subFile" accept=".srt,.vtt" hidden>
</div>

<!-- Settings -->
<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Settings</h2>
    <label>Libraries <small>One per line. Add every server: movies, TV series, anime… Optionally name it: <code>TV Series | http://172.16.50.12/</code></small>
      <textarea name="servers" rows="5" spellcheck="false" placeholder="Movies | http://172.16.50.7/&#10;TV Series | http://172.16.50.12/" required></textarea></label>
    <div class="two">
      <label>Username <small>if the server asks</small><input name="username" autocomplete="off"></label>
      <label>Password<input name="password" type="password" autocomplete="off"></label>
    </div>
    <label>TMDB API key <small>optional — adds posters, ratings and plot summaries. Free at <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org/settings/api</a></small>
      <input name="tmdbKey" autocomplete="off" spellcheck="false" placeholder="paste API key or read access token"></label>
    <p class="note" id="ffmpegNote"></p>
    <div class="actions"><button type="button" class="btn" id="cancelBtn">Cancel</button><button type="submit" class="btn primary">Save</button></div>
  </form>
</dialog>
<script src="app.js" type="module"></script>
</body>
</html>
