<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Ringbearer;src:url(fonts/Ringbearer.ttf)}
@font-face{font-family:Cardo;src:url(fonts/Cardo-400.ttf)}
@font-face{font-family:"IM Fell English";src:url(fonts/IMFellEnglish-400.ttf)}
@font-face{font-family:Dabanol;src:url(fonts/Dabanol.ttf)}
:root{--bg:#1A2218;--surface:#4F6B3A;--title:#C6A350;--accent:#9C2F12;--highlight:#C9CED6;--text:#EFE6CF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2000px;height:1125px;background:var(--bg);overflow:hidden}
.canvas{position:relative;width:2000px;height:1125px}
.art{position:absolute;left:0;top:0;width:2000px;height:1120px}
.layer{position:absolute;inset:0;pointer-events:none}
/* hide the painted scroll borders, gentle vignette */
.top{background:linear-gradient(to bottom,rgba(26,34,24,.97) 0,rgba(26,34,24,.95) 56px,rgba(26,34,24,.45) 90px,rgba(26,34,24,0) 170px)}
.bottom{background:linear-gradient(to top,rgba(26,34,24,1) 0,rgba(26,34,24,.96) 60px,rgba(26,34,24,.55) 105px,rgba(26,34,24,0) 230px)}
.vignette{background:radial-gradient(ellipse 75% 80% at 55% 45%,rgba(26,34,24,0) 62%,rgba(26,34,24,.45) 100%)}
/* title cartouche in the open sky, clear of the star, peaks, Numenor wave and volcano */
.panel{position:absolute;right:96px;top:86px;width:600px;padding:26px 30px 28px;text-align:center;
  background:rgba(26,34,24,.80);backdrop-filter:blur(6px);
  border:1.5px solid rgba(198,163,80,.85);outline:1px solid rgba(198,163,80,.4);outline-offset:-9px;
  box-shadow:0 10px 40px rgba(0,0,0,.45)}
.kicker{font-family:Ringbearer;font-size:36px;white-space:nowrap;line-height:1.1;color:var(--title)}
.title{font-family:Ringbearer;font-size:82px;white-space:nowrap;line-height:1.02;color:var(--title);text-shadow:0 0 30px rgba(198,163,80,.2)}
.rule{width:200px;height:3px;background:var(--accent);margin:16px auto 12px;box-shadow:0 0 12px rgba(156,47,18,.6)}
.bn{font-family:Dabanol;font-size:50px;line-height:1.4;color:var(--text)}
.kicker,.title,.bn{text-shadow:0 2px 10px rgba(0,0,0,.6)}
/* fixed series slot: bottom-left on every post */
.badge{position:absolute;left:96px;bottom:44px;font-family:Cardo;font-variant-numeric:lining-nums;letter-spacing:.04em;font-size:32px;line-height:1;color:var(--title);
  padding:12px 26px 14px;border:2px solid var(--title);border-radius:999px;background:rgba(26,34,24,.88);box-shadow:0 4px 18px rgba(0,0,0,.5)}
.sig{position:absolute;right:96px;bottom:44px;font-family:"IM Fell English";font-size:24px;color:rgba(239,230,207,.6)}
.sig span{font-family:Dabanol;font-size:26px}
</style></head>
<body><div class="canvas">
<img class="art" src="main.webp" alt="">
<div class="layer vignette"></div>
<div class="layer top"></div>
<div class="layer bottom"></div>
<div class="panel">
  <div class="kicker">The Complete History of</div>
  <div class="title">Middle-earth</div>
  <div class="rule"></div>
  <div class="bn">এক পৃথিবীর জন্ম থেকে বিদায়</div>
</div>
<div class="badge">Post 0 of 220</div>
<div class="sig">Musings of <span>মাকসুদ</span></div>
</div></body></html>
