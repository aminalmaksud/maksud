<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:DuneRise;src:url(fonts/DuneRise.ttf)}
@font-face{font-family:Dabanol;src:url(fonts/Dabanol.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#1a0d05}
#c{position:relative;width:1280px;height:720px;overflow:hidden}
.abs{position:absolute}
/* background: Paul, mirrored so he sits on the left looking in */
#bg{inset:0;background:url(paul.webp) 62% 30%/auto 118% no-repeat;transform:scaleX(-1);
  filter:sepia(.35) saturate(1.25) contrast(1.1) brightness(1.02)}
/* Dune grade: amber wash + right-side darkening for text */
#grade{inset:0;background:
  linear-gradient(90deg,rgba(20,8,2,0) 0%,rgba(20,8,2,.15) 40%,rgba(25,10,3,.7) 62%,rgba(20,8,2,.88) 100%),
  linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 30%,rgba(60,25,5,.25) 75%,rgba(15,6,2,.85) 100%)}
#warm{inset:0;background:radial-gradient(ellipse at 30% 35%,rgba(255,170,80,.35),rgba(170,80,20,.25) 55%,rgba(40,15,3,.4) 100%);mix-blend-mode:overlay}
#haze{left:0;right:0;bottom:0;height:260px;background:linear-gradient(0deg,rgba(196,120,55,.55),rgba(196,120,55,0));mix-blend-mode:screen}
#me{right:-30px;bottom:-6px;width:700px;filter:sepia(.18) saturate(1.05) drop-shadow(0 0 30px rgba(0,0,0,.6))}
#rim{right:-30px;bottom:-6px;width:700px;height:394px;background:linear-gradient(90deg,rgba(255,160,70,.35),rgba(255,160,70,0) 40%);mix-blend-mode:soft-light;
  -webkit-mask:url(me.png) center/100% 100%}
#overlay{inset:0;background:url(sand_overlay.png);mix-blend-mode:screen;opacity:.9}
#overlay2{inset:0;background:url(sand_overlay.png);transform:scale(-1,1) translateY(40px);mix-blend-mode:screen;opacity:.5;filter:blur(1.2px)}
#vig{inset:0;box-shadow:inset 0 0 180px 40px rgba(10,4,0,.85)}
/* titles with sand texture fill */
.sand{background-size:cover;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#title{right:44px;top:26px;text-align:right;filter:drop-shadow(0 4px 0 #3a1806) drop-shadow(0 10px 18px rgba(0,0,0,.85))}
#dune{font-family:DuneRise;font-size:156px;-webkit-text-stroke:5px transparent;paint-order:stroke fill;letter-spacing:22px;line-height:1;margin-right:-22px;
  background-image:url(sand_title.png)}
#part{font-family:DuneRise;font-size:54px;-webkit-text-stroke:2.5px transparent;letter-spacing:17px;line-height:1;margin-top:8px;margin-right:-17px;
  background-image:url(sand_title.png);background-position:0 70%}
#rule{height:3px;margin:16px 0 0 auto;width:560px;background:linear-gradient(90deg,rgba(240,180,100,0),#e8a85c 30%,#f6d7a0)}
#bn{left:34px;bottom:30px;font-family:Dabanol;line-height:1.08;filter:drop-shadow(0 4px 0 #2a1004) drop-shadow(0 8px 16px rgba(0,0,0,.9))}
#bn .l1{font-size:78px;background-image:url(sand_bn.png)}
#bn .l2{font-size:88px;background-image:url(sand_title.png);background-position:0 40%}
/* পর্ব ১ badge (flipped recreation of the supplied plate) */
#badge{left:996px;top:278px;width:282px;height:141px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.75))}
#badge img{width:100%;height:100%;display:block}
#badge .t{position:absolute;left:19.4%;width:38.6%;top:34%;height:32%;display:flex;align-items:center;justify-content:center;
  font-family:Dabanol;font-size:47px;line-height:1;padding-top:4px;white-space:nowrap;
  background:url(sand_title.png) 0 35%/300px auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  -webkit-text-stroke:1.2px transparent}
#badge .glow{position:absolute;left:19.4%;width:38.6%;top:34%;height:32%;display:flex;align-items:center;justify-content:center;
  font-family:Dabanol;font-size:47px;line-height:1;padding-top:4px;white-space:nowrap;color:#ff9a3c;filter:blur(6px);opacity:.75}
#badge .sh{position:absolute;left:19.4%;width:38.6%;top:34%;height:32%;display:flex;align-items:center;justify-content:center;
  font-family:Dabanol;font-size:47px;line-height:1;padding-top:4px;white-space:nowrap;color:#1a0a02;transform:translate(2px,3px)}
</style></head><body>
<div id="c">
  <div id="bg" class="abs"></div>
  <div id="warm" class="abs"></div>
  <div id="grade" class="abs"></div>
  <div id="haze" class="abs"></div>
  <img id="me" class="abs" src="me.png">
  <div id="rim" class="abs"></div>
  <div id="overlay2" class="abs"></div>

  <div id="title" class="abs">
    <div id="dune" class="sand">DUNE</div>
    <div id="part" class="sand">PART 3</div>
    <div id="rule"></div>
  </div>

  <div id="bn" class="abs">
    <div class="l1 sand">দেখার আগে আপনার</div>
    <div class="l2 sand">কি কি জানা দরকার</div>
  </div>

  <div id="badge" class="abs">
    <img src="badge.png">
    <div class="glow">পর্ব ১</div><div class="sh">পর্ব ১</div><div class="t">পর্ব ১</div>
  </div>
  <div id="overlay" class="abs"></div>
  <div id="vig" class="abs"></div>
</div>
</body></html>
