name: MusingsofMaksudTV Android TV on an emulator

# Installs the APK on Android TV emulators, opens it against a small fake media server, and prints the crash
# log (if any) and a screenshot. Catches what Robolectric can't: real devices, older Android versions.
on:
  push:
    paths: ['moviehub/android-tv/**', '.github/workflows/moviehub-tv-smoke.yml']
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        api: [28, 30]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: moviehub/android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Fake media server (Index of pages)
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p lib/m7 lib/m14 lib/tv
          mk() { mkdir -p "$(dirname "$1")"; head -c 1024 /dev/urandom > "$1"; }
          mk "lib/m7/English Movies (1080p)/(2024) 1080p/Dune Part Two (2024) 1080p/Dune.Part.Two.2024.1080p.mkv"
          mk "lib/m7/English Movies (1080p)/(2024) 1080p/Civil War (2024) 1080p/Civil.War.2024.1080p.mkv"
          mk "lib/m7/Animation Movies/Inside Out 2 (2024) 1080p/Inside.Out.2.2024.mkv"
          mk "lib/m14/English Movies/(2024)/Dune Part Two (2024) 720p/Dune.Part.Two.2024.720p.mp4"
          mk "lib/m14/English Movies/(2024)/Furiosa (2024)/Furiosa.2024.mkv"
          mk "lib/m14/Hindi Movies/(2024)/Stree 2 (2024)/Stree.2.2024.mkv"
          mk "lib/tv/Breaking Bad (TV Series 2008-2013) 1080p/Season 1/Breaking.Bad.S01E01.1080p.mkv"
          mk "lib/tv/Breaking Bad (TV Series 2008-2013) 1080p/Season 1/Breaking.Bad.S01E02.1080p.mkv"
          (cd lib && nohup python3 -m http.server 8000 > ../http.log 2>&1 &)
          sleep 1; curl -s http://127.0.0.1:8000/m7/ | head -5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: moviehub/android-tv
          script: bash ../../.github/scripts/tv-smoke.sh
