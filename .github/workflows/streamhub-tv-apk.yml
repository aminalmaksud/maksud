name: MusingsofMaksudTV Android TV APK

on:
  push:
    paths: ['streamhub/android-tv/**', '.github/workflows/streamhub-tv-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamhub/android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      # Logic tests and the screens on a fake two-server DhakaFlix (Robolectric).
      - run: ./gradlew --no-daemon testDebugUnitTest
        timeout-minutes: 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MusingsofMaksudTV-AndroidTV-apk
          path: streamhub/android-tv/app/build/outputs/apk/debug/app-debug.apk
