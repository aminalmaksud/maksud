name: MusingsofMaksudTV Mac app (built on Linux)

# Same app as the macOS-built DMG, packed as a zip on Linux and ad-hoc signed with rcodesign.
# Used when GitHub's Mac machines aren't available.
on:
  push:
    paths: ['streamhub/web/**', 'streamhub/mac/**', '.github/workflows/streamhub-mac-linux.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: [arm64, x64]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamhub/mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Web tests
        run: node test.js
        working-directory: streamhub/web
      - name: Install (macOS ffmpeg for ${{ matrix.arch }})
        run: npm install --no-audit --no-fund
        env:
          npm_config_platform: darwin
          npm_config_arch: ${{ matrix.arch }}
      - name: Check bundled ffmpeg matches the target
        run: file node_modules/ffmpeg-static/ffmpeg | tee /dev/stderr | grep -q "Mach-O 64-bit ${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
      - name: Get rcodesign (ad-hoc signing on Linux)
        run: |
          curl -sL https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "RCODESIGN=$RUNNER_TEMP/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign" >> "$GITHUB_ENV"
      - name: Build app (zip)
        # electron-builder ends with an update-info step that fails without a publish target; the zip is done by then.
        run: npx electron-builder --mac zip --${{ matrix.arch }} --publish never || test -f dist/MusingsofMaksudTV-1.0.0-${{ matrix.arch }}.zip
      - name: Check signatures
        run: |
          APP="dist/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/MusingsofMaksudTV.app"
          "$RCODESIGN" print-signature-info "$APP/Contents/MacOS/MusingsofMaksudTV" | grep -q ADHOC
          "$RCODESIGN" print-signature-info "$APP/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg" | grep -q ADHOC
      - uses: actions/upload-artifact@v4
        with:
          name: MusingsofMaksudTV-mac-${{ matrix.arch == 'arm64' && 'apple-silicon' || 'intel' }}-zip
          path: streamhub/mac/dist/*.zip
