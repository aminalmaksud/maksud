name: MovieHub TV APK

on:
  push:
    paths: ['moviehub/android-tv/**', '.github/workflows/moviehub-tv-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moviehub/android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MovieHub-TV-apk
          path: moviehub/android-tv/app/build/outputs/apk/debug/app-debug.apk
