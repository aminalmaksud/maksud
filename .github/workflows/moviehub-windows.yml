name: StreamHub Windows app

on:
  push:
    paths: ['moviehub/web/**', 'moviehub/windows/**', '.github/workflows/moviehub-windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: moviehub/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1' # must match NODE_VERSION in scripts/build-server.mjs
      - name: Web tests
        run: node test.js
        working-directory: moviehub/web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: moviehub/windows/src-tauri
      - name: Install (Windows ffmpeg)
        run: npm ci --no-audit --no-fund
        env:
          npm_config_platform: win32
          npm_config_arch: x64
      - name: Build server and ffmpeg sidecars
        run: npm run build-server
      - name: Smoke test the bundled server
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          PORT=47990 WEB_ROOT="$PWD/../web" CONFIG_FILE="$RUNNER_TEMP/data/config.json" \
            FFMPEG_PATH="$PWD/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe" \
            FFPROBE_PATH="$PWD/src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe" \
            src-tauri/binaries/mmtv-server-x86_64-pc-windows-msvc.exe &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:47990/api/config > config.json && break; sleep 1; done
          cat config.json
          grep -q '"ffmpeg":true' config.json
          curl -sf http://127.0.0.1:47990/ | grep -q '<title>'
          kill %1
      - name: Build installer
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: StreamHub-windows-x64
          path: moviehub/windows/src-tauri/target/release/bundle/nsis/*.exe
