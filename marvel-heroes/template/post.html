<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"CB Title";src:url(fonts/ComicBook-BoldItalic.otf)}
@font-face{font-family:"CB Support";src:url(fonts/ComicBook-Bold.otf)}
@font-face{font-family:"Dabanol";src:url(fonts/Dabanol.ttf)}
@font-face{font-family:"Barlow";src:url(fonts/Barlow-400.ttf);font-weight:400}
@font-face{font-family:"Barlow";src:url(fonts/Barlow-700.ttf);font-weight:700}
:root{
  --bg:#0B0B0D;--surface:#1B2A4A;--title:#E23636;
  --accent:#F7C948;--highlight:#7A8291;--text:#F5F3EE;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:var(--bg);overflow:hidden}
#c{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}

/* art */
#art{position:absolute;display:block}
/* scrim: fade the art into ink black under the text block */
#scrim{position:absolute;left:0;right:0;bottom:0;height:var(--scrim-h,520px);
  background:linear-gradient(to top,var(--bg) 0%,rgba(11,11,13,.94) 30%,rgba(11,11,13,.7) 55%,rgba(11,11,13,0) 100%)}
#topscrim{position:absolute;left:0;right:0;top:0;height:200px;
  background:linear-gradient(to bottom,rgba(11,11,13,.55),rgba(11,11,13,0))}
/* halftone overlay, 10 percent, only in the lower block */
#dots{position:absolute;left:0;right:0;bottom:0;height:380px;opacity:.10;
  background-image:radial-gradient(circle,var(--accent) 1.8px,transparent 2.4px);
  background-size:14px 14px;
  -webkit-mask-image:linear-gradient(to top,#000 0%,#000 30%,transparent 100%);
          mask-image:linear-gradient(to top,#000 0%,#000 30%,transparent 100%)}
/* thick comic panel border */
#frame{position:absolute;inset:0;border:12px solid var(--bg);pointer-events:none}
#frame::after{content:"";position:absolute;inset:16px;border:3px solid var(--accent);opacity:.9}

/* badges */
.badge{position:absolute;top:62px;display:flex;transform:skewX(-10deg);
  border:4px solid var(--bg);box-shadow:8px 8px 0 var(--bg)}
.badge span{display:block;transform:skewX(10deg);font-family:"CB Support";
  font-size:34px;line-height:1;letter-spacing:1px;text-transform:uppercase;padding:14px 22px 12px}
#arc{left:96px}
#arc .n{background:var(--accent);color:var(--bg)}
#arc .name{background:var(--bg);color:var(--accent)}
#day{right:96px;background:var(--title)}
#day span{color:var(--bg)}

/* text block, lower left */
#block{position:absolute;left:96px;bottom:78px;max-width:1220px}
#hero{font-family:"CB Title";font-size:var(--hero-size,180px);line-height:.95;
  color:var(--title);text-transform:uppercase;letter-spacing:3px;white-space:nowrap;
  -webkit-text-stroke:6px var(--bg);paint-order:stroke fill;
  text-shadow:10px 10px 0 var(--bg)}
#rule{width:260px;height:7px;background:var(--accent);margin:22px 0 24px;
  transform:skewX(-20deg);box-shadow:5px 5px 0 var(--bg)}
#tag{display:inline-block;background:var(--surface);
  border-left:12px solid var(--accent);padding:14px 34px 20px 30px;
  box-shadow:9px 9px 0 #000;white-space:nowrap}
#tag p{font-family:"Dabanol";font-size:var(--tag-size,62px);line-height:1.4;color:var(--text)}

/* signature and links, lower right */
#sig{position:absolute;right:96px;bottom:78px;text-align:right;color:var(--text)}
#sig .name{font-family:"Dabanol";font-size:32px;line-height:1.4;opacity:.75;margin-bottom:10px}
#sig .link{display:flex;align-items:center;justify-content:flex-end;gap:12px;
  font-family:"Barlow";font-weight:700;font-size:25px;line-height:1;opacity:.9;margin-top:10px}
#sig svg{width:28px;height:28px;flex:none}
</style>
</head>
<body>
<div id="c">
  <img id="art" alt="">
  <div id="topscrim"></div>
  <div id="scrim"></div>
  <div id="dots"></div>

  <div id="arc" class="badge"><span class="n"></span><span class="name"></span></div>
  <div id="day" class="badge"><span></span></div>

  <div id="block">
    <div id="hero"></div>
    <div id="rule"></div>
    <div id="tag"><p></p></div>
  </div>

  <div id="sig">
    <div class="name">Musings of মাকসুদ</div>
    <div class="link" id="web">
      <span></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="#F7C948" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2c3 3.2 3 16.8 0 20M12 2c-3 3.2-3 16.8 0 20"/></svg>
    </div>
    <div class="link" id="yt">
      <span></span>
      <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="5" fill="#F7C948"/><path d="M10 8.5v7l6-3.5z" fill="#0B0B0D"/></svg>
    </div>
  </div>
  <div id="frame"></div>
</div>
<script>
// window.POST is injected by render.js; this default is a preview of Day 1.
const P = window.POST || {
  hero:"Spider-Man", tagline:"এক রাতের ভুল, সারাজীবনের প্রায়শ্চিত্ত",
  arc:1, arcName:"Avengers core", day:1, total:100,
  image:"../images/day-001-spider-man.webp",
  art:{width:1929,left:-4,top:0}
};
const SITE = "www.musingsofmaksud.com";
const YOUTUBE = "https://www.youtube.com/@MusingsofMaksud";

const $ = s => document.querySelector(s);
const art = $('#art');
art.src = P.image;
const a = P.art || {width:1920,left:0,top:0};
art.style.width = a.width+'px'; art.style.left = a.left+'px'; art.style.top = a.top+'px';
if (a.scrimHeight) document.documentElement.style.setProperty('--scrim-h', a.scrimHeight+'px');
$('#arc .n').textContent = 'Arc ' + P.arc;
$('#arc .name').textContent = P.arcName;
$('#day span').textContent = `Day ${P.day} of ${P.total}`;
$('#hero').textContent = P.hero;
$('#tag p').textContent = P.tagline;
$('#web span').textContent = SITE;
$('#yt span').textContent = YOUTUBE;

// shrink long names / taglines so they never run into the links block
function fit(el, varName, start, min, maxW){
  let s = start;
  document.documentElement.style.setProperty(varName, s+'px');
  while (el.scrollWidth > maxW && s > min){ s -= 2; document.documentElement.style.setProperty(varName, s+'px'); }
}
window.fitAll = () => {
  const room = 1920 - 96 - $('#sig').offsetWidth - 60 - 96;
  fit($('#hero'),'--hero-size',180,100,room);
  fit($('#tag'),'--tag-size',62,44,room);
};
document.fonts.ready.then(window.fitAll);
</script>
</body>
</html>
