<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"CB Title";src:url(fonts/ComicBook-BoldItalic.otf)}
@font-face{font-family:"CB Support";src:url(fonts/ComicBook-Bold.otf)}
@font-face{font-family:"Dabanol";src:url(fonts/Dabanol.ttf)}
:root{
  --bg:#0B0B0D;--surface:#1B2A4A;--title:#E23636;
  --accent:#F7C948;--highlight:#7A8291;--text:#F5F3EE;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;background:var(--bg);overflow:hidden}
#c{position:relative;width:1080px;height:1080px;overflow:hidden;background:var(--bg)}

/* art */
#art{position:absolute;display:block}
/* scrim: fade the art into ink black under the text block */
#scrim{position:absolute;left:0;right:0;bottom:0;height:var(--scrim-h,560px);
  background:linear-gradient(to top,var(--bg) 0%,var(--bg) 38%,rgba(11,11,13,.86) 55%,rgba(11,11,13,0) 100%)}
/* halftone overlay, 10 percent, only in the lower block */
#dots{position:absolute;left:0;right:0;bottom:0;height:420px;opacity:.10;
  background-image:radial-gradient(circle,var(--accent) 1.6px,transparent 2.2px);
  background-size:12px 12px;
  -webkit-mask-image:linear-gradient(to top,#000 0%,#000 30%,transparent 100%);
          mask-image:linear-gradient(to top,#000 0%,#000 30%,transparent 100%)}
/* thick comic panel border */
#frame{position:absolute;inset:0;border:10px solid var(--bg);pointer-events:none}
#frame::after{content:"";position:absolute;inset:14px;border:3px solid var(--accent);opacity:.9}

/* badges */
.badge{position:absolute;top:56px;display:flex;transform:skewX(-10deg);
  border:4px solid var(--bg);box-shadow:7px 7px 0 var(--bg)}
.badge span{display:block;transform:skewX(10deg);font-family:"CB Support";
  font-size:30px;line-height:1;letter-spacing:1px;text-transform:uppercase;padding:13px 18px 11px}
#arc{left:56px}
#arc .n{background:var(--accent);color:var(--bg)}
#arc .name{background:var(--bg);color:var(--accent)}
#day{right:56px;background:var(--title)}
#day span{color:var(--bg)}

/* text block */
#block{position:absolute;left:72px;right:72px;bottom:96px}
#hero{font-family:"CB Title";font-size:var(--hero-size,150px);line-height:.95;
  color:var(--title);text-transform:uppercase;letter-spacing:2px;white-space:nowrap;
  -webkit-text-stroke:5px var(--bg);paint-order:stroke fill;
  text-shadow:9px 9px 0 var(--bg)}
#rule{width:220px;height:6px;background:var(--accent);margin:20px 0 22px;
  transform:skewX(-20deg);box-shadow:5px 5px 0 var(--bg)}
#tag{display:inline-block;position:relative;background:var(--surface);
  border-left:10px solid var(--accent);padding:14px 30px 18px 26px;
  box-shadow:8px 8px 0 #000}
#tag p{font-family:"Dabanol";font-size:var(--tag-size,54px);line-height:1.4;color:var(--text)}

#sig{position:absolute;right:56px;bottom:46px;font-family:"Dabanol";font-size:24px;
  color:var(--text);opacity:.6}
</style>
</head>
<body>
<div id="c">
  <img id="art" alt="">
  <div id="scrim"></div>
  <div id="dots"></div>

  <div id="arc" class="badge"><span class="n"></span><span class="name"></span></div>
  <div id="day" class="badge"><span></span></div>

  <div id="block">
    <div id="hero"></div>
    <div id="rule"></div>
    <div id="tag"><p></p></div>
  </div>

  <div id="sig">Musings of মাকসুদ</div>
  <div id="frame"></div>
</div>
<script>
// window.POST is injected by render.js; this default is a preview of Day 1.
const P = window.POST || {
  hero:"Spider-Man", tagline:"এক রাতের ভুল, সারাজীবনের প্রায়শ্চিত্ত",
  arc:1, arcName:"Avengers core", day:1, total:100,
  image:"../images/day-001-spider-man.webp",
  art:{width:1440,left:-180,top:0}
};
const $ = s => document.querySelector(s);
const art = $('#art');
art.src = P.image;
const a = P.art || {width:1080,left:0,top:0};
art.style.width = a.width+'px'; art.style.left = a.left+'px'; art.style.top = a.top+'px';
if (a.scrimHeight) document.documentElement.style.setProperty('--scrim-h', a.scrimHeight+'px');
$('#arc .n').textContent = 'Arc ' + P.arc;
$('#arc .name').textContent = P.arcName;
$('#day span').textContent = `Day ${P.day} of ${P.total}`;
$('#hero').textContent = P.hero;
$('#tag p').textContent = P.tagline;

// shrink long names / taglines to fit the 936px text column
function fit(el, varName, start, min){
  let s = start;
  document.documentElement.style.setProperty(varName, s+'px');
  while (el.scrollWidth > 936 && s > min){ s -= 2; document.documentElement.style.setProperty(varName, s+'px'); }
}
window.fitAll = () => { fit($('#hero'),'--hero-size',150,84); fit($('#tag'),'--tag-size',54,40); };
document.fonts.ready.then(window.fitAll);
</script>
</body>
</html>
