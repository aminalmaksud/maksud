<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Archides;src:url(Archides.otf)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#140a05}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Archides;color:#1b110b}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
canvas,svg.layer{position:absolute;left:0;top:0}
svg text{font-family:Archides}
.t{position:absolute;left:0;width:1920px;text-align:center;white-space:nowrap;will-change:transform,opacity}
.lbl{position:absolute;text-align:center;white-space:nowrap;transform:translateX(-50%)}

.white{color:#f1e4c6;text-shadow:0 2px 0 rgba(27,17,11,.8)}
.ls{letter-spacing:.32em}
#eug span{display:inline-block}
</style></head>
<body><div id="stage"><div id="cam">

    <rect x="-700" y="-300" width="1400" height="600" fill="#fff"/>

  </mask>
</defs>

<script>
const W=1920,H=1080,$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const out=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
let s=23;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;};

/* ---------- aged terracotta ground ---------- */
(function(){
  const c=$('bg').getContext('2d');
  const g=c.createRadialGradient(W/2,H*.45,80,W/2,H/2,1150);
  g.addColorStop(0,'#cf7442');g.addColorStop(.55,'#b5552b');g.addColorStop(1,'#7c3418');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){const x=rnd()*W,y=rnd()*H,r=60+rnd()*260,dark=rnd()<.6;
    const b=c.createRadialGradient(x,y,0,x,y,r);
    b.addColorStop(0,dark?`rgba(70,28,10,${.05+rnd()*.08})`:`rgba(240,190,140,${.04+rnd()*.06})`);b.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=b;c.fillRect(x-r,y-r,2*r,2*r);}
  c.lineCap='round';
  for(let i=0;i<900;i++){const x=rnd()*W,y=rnd()*H,a=rnd()*6.28,l=6+rnd()*30;
    c.strokeStyle=rnd()<.5?`rgba(60,24,8,${.05+rnd()*.07})`:`rgba(250,210,170,${.04+rnd()*.06})`;c.lineWidth=.6+rnd();
    c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke();}
  for(let i=0;i<14;i++){let x=rnd()*W,y=rnd()*H,a=rnd()*6.28;c.strokeStyle=`rgba(50,18,6,${.12+rnd()*.12})`;c.lineWidth=.8+rnd()*.8;
    c.beginPath();c.moveTo(x,y);for(let k=0;k<20+rnd()*30;k++){a+=(rnd()-.5)*.9;x+=Math.cos(a)*9;y+=Math.sin(a)*9;c.lineTo(x,y);}c.stroke();}
  const id=c.getImageData(0,0,W,H),d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*26;d[i]+=n;d[i+1]+=n*.85;d[i+2]+=n*.7;}
  c.putImageData(id,0,0);
})();

/* ---------- scroll writing + burn holes ---------- */
(function(){
  const w=$('writing');let d='';
  for(let col=0;col<5;col++){const x0=-520+col*212;
    for(let r=0;r<9;r++){const y=-110+r*27;let x=x0;
      while(x<x0+180){const l=6+rnd()*22;if(x+l>x0+184)break;d+=`M${x.toFixed(0)} ${y} h${l.toFixed(0)} `;x+=l+7+rnd()*6;}}}
  el('path',{d},w);
  // irregular burn holes, mostly at the right end and the lower edge: the epic is lost
  const H=[[420,-40,1.0],[505,60,1.1],[540,-120,.9],[300,120,.8],[180,150,.7],[360,-150,.6],[-80,155,.6],[-300,150,.55],[470,150,.9],[-520,-150,.5],[60,-155,.45]];
  window.HOLES=H.map(([cx,cy,k])=>{let pts=[];const n=14;for(let i=0;i<n;i++){const a=i/n*6.283,r=(.7+rnd()*.5);pts.push([Math.cos(a)*r,Math.sin(a)*r]);}
    const d='M'+pts.map(p=>p.map(v=>(v*100).toFixed(1)).join(' ')).join(' L')+' Z';
    const hole=el('path',{d,fill:'#000'},$('holes'));
    const em=el('path',{d,stroke:'#ffb34d','stroke-width':3},$('embers'));
    const em2=el('path',{d,stroke:'#2a1208','stroke-width':16,opacity:.8},$('embers'));
    $('embers').insertBefore(em2,em);
    return {cx,cy,k,hole,em,em2,ph:rnd()*6};});
})();

/* ---------- map (simple equirectangular, lon 10..36E, lat 30..42N) ---------- */
const MX=lon=>1246+(lon-10)*21.85, MY=lat=>306+(42-lat)*37.3;
(function(){
  const poly=(pts)=>'M'+pts.map(([lo,la])=>`${MX(lo).toFixed(1)} ${MY(la).toFixed(1)}`).join(' L')+' Z';
  const L=$('lands');
  const shapes=[
    // Africa
    [[10,30],[10,33.8],[10.6,35.6],[10.4,36.9],[11.1,37.0],[11.1,35.2],[10.1,34.3],[11.2,33.2],[12.5,32.8],[15.2,32.3],[15.6,31.4],[17.5,30.9],[19,30.3],[20,30.9],[20.1,32.2],[20.8,32.7],[21.8,32.9],[22.6,32.8],[23.2,32.3],[24.2,32.0],[25.2,31.6],[27,31.4],[29,30.9],[30.2,31.5],[31,31.6],[32.3,31.2],[34.2,31.3],[34.9,32.6],[35.6,33.9],[35.9,35.2],[36,36],[36,30]],
    // Greece + Balkans + Asia Minor joined across the north
    [[18.4,42],[19.4,41.9],[19.5,40.9],[19.3,40.4],[20.0,39.6],[20.7,38.9],[21.1,38.3],[21.6,37.7],[21.6,36.9],[22.2,36.5],[22.5,36.9],[22.8,36.5],[23.1,36.5],[23.1,37.3],[22.8,37.6],[23.4,37.4],[23.2,37.9],[24.0,37.7],[24.1,38.2],[23.6,38.6],[23.0,39.0],[22.9,39.4],[22.6,40.0],[22.9,40.6],[23.4,40.2],[23.9,40.0],[23.7,40.4],[24.3,40.1],[24.0,40.8],[25.0,40.9],[26.0,40.8],[26.5,41.2],[26.4,40.0],[26.2,39.5],[26.9,39.3],[26.6,38.6],[26.4,38.3],[27.2,37.9],[27.2,37.3],[27.6,36.8],[28.2,36.7],[29.2,36.4],[30.5,36.4],[31.2,36.8],[32.6,36.1],[33.9,36.2],[34.6,36.8],[36,36.8],[36,42]],
    // Peloponnese is joined; Euboea
    [[23.0,38.9],[24.0,38.3],[24.5,38.1],[24.2,38.6],[23.3,39.0]],
    // Crete
    [[23.5,35.4],[24.3,35.5],[25.4,35.3],[26.3,35.2],[26.2,35.0],[25.0,35.0],[24.0,35.2]],
    // Sicily
    [[12.4,37.9],[13.4,38.2],[15.6,38.3],[15.1,37.3],[15.1,36.7],[14.3,37.0],[12.5,37.6]],
    // Italian toe & heel
    [[15.6,42],[15.6,40.0],[16.0,39.4],[15.7,38.3],[16.1,38.0],[16.6,38.4],[17.2,39.0],[17.0,39.4],[16.5,39.7],[17.0,40.5],[18.5,40.1],[18.4,40.4],[17.0,41.0],[16.0,41.6],[16.0,42]],
    // Rhodes, Cyprus
    [[27.7,36.2],[28.2,36.4],[28.2,36.0],[27.8,35.9]],
    [[32.3,35.0],[33.0,35.4],[34.6,35.7],[33.9,35.1],[33.0,34.6],[32.3,34.8]]
  ];
  shapes.forEach(p=>el('path',{d:poly(p)},L));
  // little islands of the Aegean, incl. Thera
  [[25.4,36.4],[25.4,37.1],[24.9,37.4],[25.3,37.6],[26.0,36.9],[24.4,37.6],[26.5,37.3],[25.9,38.4],[26.1,39.2]].forEach(([lo,la])=>el('circle',{cx:MX(lo),cy:MY(la),r:4.5},L));
  // waves
  let d='';for(let y=330;y<760;y+=34)for(let x=1250+((y/34)%2)*24;x<1820;x+=48)d+=`M${x} ${y} q8 -8 16 0 `;
  $('mapWaves').setAttribute('d',d);
  // colonists from Thera founded Cyrene
  const tx=MX(25.4),ty=MY(36.4),cx=MX(21.85),cy=MY(32.82);
  $('theraRoute').setAttribute('d',`M${tx} ${ty} Q${(tx+cx)/2+60} ${(ty+cy)/2} ${cx} ${cy}`);
  window.PIN=[cx,cy];
})();

/* ---------- timeline ticks ---------- */
const TX=yr=>260+(850-yr)*3.5;
(function(){[800,700,600,500].forEach((y,i)=>{const g=el('g',{class:'tick'},$('ticks'));
  el('path',{d:`M${TX(y)} 744 V794`,stroke:'#1b110b','stroke-width':4},g);
  const t=el('text',{x:TX(y),y:826,'font-size':22,fill:'#1b110b','text-anchor':'middle','letter-spacing':3},g);t.textContent=y+' BC';});})();

/* ---------- EUGAMMON letters ---------- */
$('eug').innerHTML=[...'EUGAMMON'].map(c=>`<span>${c}</span>`).join('');
const EL=[...$('eug').children];

const fx=$('fx').getContext('2d');
const motes=[...Array(70)].map(()=>({x:rnd()*W,y:rnd()*H,r:.8+rnd()*2.2,v:6+rnd()*16,p:rnd()*6.28}));
const ash=[...Array(90)].map(()=>({h:Math.floor(rnd()*6),a:rnd()*6.28,v:40+rnd()*120,up:30+rnd()*80,r:1+rnd()*3,d:rnd()*.6}));
const dust=[...Array(60)].map(()=>({a:rnd()*6.28,v:200+rnd()*500,r:1.5+rnd()*3.5}));

function op(id,o,tr){const e=$(id);e.style.opacity=o;if(tr!==undefined){if(e instanceof SVGElement)e.setAttribute('transform',tr);else e.style.transform=tr;}}
function dashUpTo(len){let a=[],acc=0;while(acc+24<=len){a.push(14,10);acc+=24;}a.push(.001,99999);return a.join(' ');}

/* Voice-over beats (seconds, from silence detection)
   0.00-1.50 "from here the story continues"      1.72-3.86 "following a lost epic of a later age"
   4.22-4.62 "whose name is"   4.84-5.25 "Telegony"   5.96-6.64 "which was written by"
   6.85-8.91 "a poet named Eugammon of Cyrene"     9.47-10.58 "long after even Homer"
   10.83-11.49 "BC"   11.75-12.40 "in the sixth century" */
function render(t){
  // stamp shakes
  const shake=(t0,amp)=>{const k=seg(t,t0,t0+.45);return k>0&&k<1?amp*(1-k)*Math.sin(t*90):0;};
  const sh=shake(4.86,9)+shake(11.78,7);
  const z=1+.03*(t/14.5)+.004*Math.sin(t*.7);
  $('cam').style.transform=`translate(${sh}px,${sh*.6}px) scale(${z})`;
  $('black').style.opacity=1-seg(t,0,.5);
  const lx=50+8*Math.sin(t*.25),ly=40+4*Math.cos(t*.31),fl=.20+.03*Math.sin(t*3.1)+.02*Math.sin(t*7.3)+.12*Math.exp(-Math.pow((t-3.4)/.5,2));
  $('light').style.background=`radial-gradient(ellipse 60% 55% at ${lx}% ${ly}%,rgba(255,196,120,${fl}) 0%,rgba(255,160,90,0) 70%)`;
  const fr=ease(seg(t,.05,1.0));$('frameRect').setAttribute('x',960-960*fr);$('frameRect').setAttribute('width',1920*fr);

  /* ---- S1: the story continues ---- */
  const k0=out(seg(t,.25,.9))*(1-seg(t,1.45,1.8));op('k0',k0,`translateY(${(1-k0)*-18}px)`);$('k0').style.letterSpacing=`${.5-.18*k0}em`;

  /* ---- scroll: appear, unroll, burn, title, rise to banner ---- */
  const sIn=back(seg(t,.4,1.2));
  const un=ease(seg(t,1.65,2.9));
  const half=lerp(26,545,un);
  $('sheetClipR').setAttribute('x',-half);$('sheetClipR').setAttribute('width',2*half);
  $('rollL').setAttribute('transform',`translate(${-half-4} 0)`);$('rollR').setAttribute('transform',`translate(${half+4} 0)`);
  const up=ease(seg(t,5.9,6.8));
  const sx=960,sy=lerp(560,186,up),ss=lerp(1,.44,up)*lerp(.6,1,sIn);
  const bob=Math.sin(t*1.3)*3*(1-up);
  op('scroll',seg(t,.4,.7),`translate(${sx} ${sy+bob}) scale(${ss}) rotate(${(1-sIn)*-6})`);
  // burn: the epic is lost
  const burn=ease(seg(t,2.7,3.9));
  HOLES.forEach((h,i)=>{const k=h.k*burn*clamp(1.4-i*.05);const tr=`translate(${h.cx} ${h.cy}) scale(${k*.55+.0001})`;
    h.hole.setAttribute('transform',tr);
    const er=`translate(${h.cx} ${h.cy}) scale(${k*.55*1.04+.0001})`;h.em.setAttribute('transform',er);h.em2.setAttribute('transform',er);
    const glow=burn>0?(.35+.4*Math.sin(t*9+h.ph)**2)*(1-.6*seg(t,4.6,6)):0;
    h.em.setAttribute('opacity',glow);const sw=1/(k*.55*1.04+.0001);h.em.setAttribute('stroke-width',3*sw);h.em2.setAttribute('stroke-width',16*sw);h.em2.setAttribute('opacity',burn>0?.8:0);});
  // labels above scroll
  const lo=out(seg(t,2.0,2.6))*(1-seg(t,5.7,6.0));op('lost',lo,`translateY(${(1-lo)*24}px) scale(${1.15-.15*lo})`);
  const la=out(seg(t,2.9,3.5))*(1-seg(t,5.7,6.0));op('later',la,`translateY(${(1-la)*16}px)`);$('later').style.letterSpacing=`${.6-.28*la}em`;
  const nm=out(seg(t,4.2,4.6))*(1-seg(t,5.8,6.1));op('itsName',nm);
  const ti=seg(t,4.84,5.2),tb=back(ti);
  op('title',seg(t,4.84,4.95),`translate(0 ${lerp(0,-10,up)}) scale(${lerp(1.7,1,tb)})`);
  $('titleRule').setAttribute('d',`M${-380*ease(seg(t,5.1,5.6))} 96 H${380*ease(seg(t,5.1,5.6))}`);
  const cy=out(seg(t,5.25,5.6))*(1-seg(t,5.8,6.0));op('cycle',cy,`translateY(${(1-cy)*16}px)`);

  /* ---- S4: the poet Eugammon of Cyrene ---- */
  const wb=out(seg(t,6.0,6.5))*(1-seg(t,9.1,9.5));op('wby',wb,`translateX(-50%) translateY(${(1-wb)*14}px)`);
  const eOut=1-seg(t,9.1,9.5);
  EL.forEach((e,i)=>{const p=out(seg(t,6.85+i*.07,7.45+i*.07));e.style.opacity=p*eOut;
    e.style.transform=`translateY(${(1-p)*50}px) scale(${1.3-.3*p})`;e.style.filter=`blur(${(1-p)*8}px)`;});
  const oc=out(seg(t,7.95,8.5))*eOut;op('ofc',oc,`translateX(-50%) translateY(${(1-oc)*20}px)`);$('ofc').style.letterSpacing=`${.4-.28*oc}em`;
  const gc=out(seg(t,8.4,8.9))*eOut;op('gcity',gc,`translateX(-50%) translateY(${(1-gc)*14}px)`);
  // poet: rises at left, then walks to his century on the timeline
  const pIn=out(seg(t,6.0,6.9)),walk=ease(seg(t,9.6,11.0));
  const px=lerp(300,1310,walk),py=lerp(880,742,walk),ps=lerp(1,.66,walk);
  const step=Math.sin(seg(t,9.6,11.0)*Math.PI*8)*(walk>0&&walk<1?1:0);
  op('poet',seg(t,6.0,6.3),`translate(${px} ${py+(1-pIn)*80-Math.abs(step)*6}) scale(${ps})`);
  $('poetIn').setAttribute('transform',`rotate(${step*1.5+Math.sin(t*1.2)*.6})`);
  // map
  const mp=out(seg(t,7.5,8.2))*(1-seg(t,9.1,9.5));op('map',mp,`translate(${(1-mp)*60} 0)`);
  const pinP=back(seg(t,8.05,8.55));
  $('pin').setAttribute('transform',`translate(${PIN[0]} ${PIN[1]}) scale(${pinP+.0001})`);
  const ring=(t*1.2)%1;$('pinRing').setAttribute('r',14+ring*26);$('pinRing').setAttribute('opacity',(1-ring)*seg(t,8.3,8.5));
  const pl=out(seg(t,8.3,8.7));$('pinLbl').setAttribute('transform',`translate(${PIN[0]+128} ${PIN[1]+52-(1-pl)*10})`);$('pinLbl').style.opacity=pl;
  const tr=ease(seg(t,8.5,9.1));const rl=$('theraRoute');const RL=rl.getTotalLength();rl.setAttribute('stroke-dasharray',`${RL*tr} 9999`);
  rl.style.opacity=tr>0?1:0;rl.setAttribute('stroke-dasharray',tr>0?dashUpToDots(RL*tr):'0 9999');

  /* ---- S5: long after Homer, 6th century BC ---- */
  const tl=ease(seg(t,9.4,10.2));
  $('tlLine').setAttribute('d',`M230 760 H${lerp(230,1690,tl)}`);$('tlArrowHead').setAttribute('transform',`translate(${lerp(-1460,0,tl)} 0)`);
  $('tlArrowHead').style.opacity=seg(t,9.45,9.6);$('tlLine').style.opacity=seg(t,9.4,9.5);
  [...$('ticks').children].forEach((g,i)=>{const p=out(seg(t,10.83+i*.12,11.2+i*.12));g.style.opacity=p;g.setAttribute('transform',`translate(0 ${(1-p)*12})`);});
  const b8=out(seg(t,9.75,10.25));op('blk8',b8,`translate(610 760) scale(${b8} 1) translate(-610 -760)`);
  const hm=back(seg(t,9.55,10.25));op('homer',seg(t,9.55,9.75),`translate(610 ${742+(1-hm)*60}) scale(${.95})`);
  const hc=out(seg(t,10.0,10.5));op('hCap',hc,`translateX(-50%) translateY(${(1-hc)*14}px)`);
  const gp=ease(seg(t,10.1,11.0));$('gapLine').setAttribute('d',`M800 640 H${lerp(800,1120,gp)}`);
  $('gapHead').setAttribute('transform',`translate(${lerp(-320,0,gp)} 0)`);op('gap',seg(t,10.1,10.2));
  const l2=out(seg(t,10.2,10.7));op('later2',l2,`translateX(-50%) translateY(${(1-l2)*14}px)`);
  const ce=out(seg(t,10.8,11.3));op('cent',ce,`translateX(-50%)`);
  const b6=out(seg(t,11.6,12.0));op('blk6',b6,`translate(1310 760) scale(${b6} 1) translate(-1310 -760)`);
  const sx6=back(seg(t,11.75,12.2));op('sixth',seg(t,11.75,11.85),`translateX(-50%) scale(${lerp(1.8,1,sx6)})`);
  const ec=out(seg(t,12.3,12.9));op('eCap',ec,`translateX(-50%) translateY(${(1-ec)*12}px)`);

  /* ---- particles ---- */
  fx.clearRect(0,0,W,H);
  for(const m of motes){const y=((m.y-m.v*t*2)%H+H)%H,x=m.x+Math.sin(t*.8+m.p)*14;
    fx.fillStyle=`rgba(255,${200+m.r*15|0},140,${(.15+.25*Math.sin(t*1.7+m.p)**2)*seg(t,0,1.2)})`;
    fx.beginPath();fx.arc(x,y,m.r,0,6.3);fx.fill();}
  // ash and embers rising from the burning scroll
  const ab=seg(t,2.8,6.0);
  if(ab>0&&ab<1){for(const a of ash){const h=HOLES[a.h];const k=clamp((ab-a.d*.4)/.6);if(k<=0)continue;
      const x=sx+(h.cx+Math.cos(a.a)*40)*ss+Math.sin(t*3+a.a)*10*k,y=sy+(h.cy+Math.sin(a.a)*30)*ss-a.up*k*3;
      fx.fillStyle=a.r>2.5?`rgba(255,190,90,${(1-k)*.9})`:`rgba(40,18,8,${(1-k)*.7})`;fx.beginPath();fx.arc(x,y,a.r,0,6.3);fx.fill();}}
  // dust burst on the two stamps
  const burst=(t0,cx,cy,sc)=>{const k=seg(t,t0,t0+.8);if(k<=0||k>=1)return;for(const d of dust){const r=d.v*out(k)*sc;
      fx.fillStyle=`rgba(60,26,10,${(1-k)*.5})`;fx.beginPath();fx.arc(cx+Math.cos(d.a)*r*1.6,cy+Math.sin(d.a)*r*.5,d.r,0,6.3);fx.fill();}};
  burst(4.86,960,600,1);burst(11.78,1310,880,.5);
}
function dashUpToDots(len){let a=[],acc=0;while(acc+14<=len){a.push(2,12);acc+=14;}a.push(.001,99999);return a.join(' ');}
window.render=render;
document.fonts.ready.then(()=>{render(0);window.ready=true;});
</script></body></html>
